version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: checktime-db
    env_file:
      - stack.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${DB_STORAGE_PATH}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_DB_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/gonzalez8/checktime:${CHECK_TIME_VERSION}
    container_name: checktime-app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    # Promtail relabels `job` from `com.docker.compose.service`, which would
    # leave this container as job="app" (Compose service is named `app`).
    # `logging_job` is the override label our Promtail config consumes to
    # pin it as job="checktime" instead — matching the Grafana queries.
    labels:
      - "logging_job=checktime"
    volumes:
      - ./config:/app/config
      - /var/log/checktime:/var/log/checktime
    ports:
      - "${WEB_PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
